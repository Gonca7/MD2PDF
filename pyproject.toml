[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf"
version = "0.1.0"
description = "An opensource and generalized Markdown to PDF converter"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
]

[project.scripts]
md2pdf = "md2pdf.main:main"

[tool.setuptools.packages.find]
where = ["src"]